name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify project
        run: |
          ls -la
          ls -la CollegeClubManagement.xcodeproj
          xcodebuild -list -project CollegeClubManagement.xcodeproj

      - name: Build iOS app
        run: |
          xcodebuild \
            -project CollegeClubManagement.xcodeproj \
            -scheme CollegeClubManagement \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Boot iPhone Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE '[A-F0-9-]{36}' | head -1)
          echo "Using simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install app on Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices booted | grep -oE '[A-F0-9-]{36}' | head -1)
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/CollegeClubManagement.app

      - name: Launch app on Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices booted | grep -oE '[A-F0-9-]{36}' | head -1)
          xcrun simctl launch "$DEVICE_ID" com.sanjanav19.CollegeClubManagement

      - name: Wait for app
        run: sleep 5

      - name: Take Simulator Screenshot
        run: |
          DEVICE_ID=$(xcrun simctl list devices booted | grep -oE '[A-F0-9-]{36}' | head -1)
          xcrun simctl io "$DEVICE_ID" screenshot simulator.png

      - name: Upload Simulator Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-Simulator-Screenshot
          path: simulator.png