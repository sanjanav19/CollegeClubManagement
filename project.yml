name: CollegeClubManagement

options:
  bundleIdPrefix: com.sanjanav19
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  CollegeClubManagement:
    type: application
    platform: iOS

    sources:
      - path: App
      - path: Models
      - path: Data
      - path: ViewModels
      - path: Views

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sanjanav19.CollegeClubManagement
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CampusConnect
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"